[package]
name = "modelforge"
version = "0.2.0"
edition = "2024"
description = "CLI en Rust para importar modelos GGUF desde HuggingFace, crearlos en Ollama, validarlos y enrutarlos en un gateway OpenAI-compatible."
license = "MIT"
repository = "https://github.com/atareao/modelforge"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3"
hf-hub = "1.0.0"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
